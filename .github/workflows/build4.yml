name: LaingoPop Background Build
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Unzip project
        run: |
          mkdir app
          unzip -q LaingoPop_capacitor.zip -d app
      - name: Install and add Android
        working-directory: app
        run: |
          npm install
          npx cap add android
      - name: Alarm sound
        working-directory: app
        run: |
          mkdir -p android/app/src/main/res/raw
          cp android-res-raw/alarm.wav android/app/src/main/res/raw/alarm.wav
      - name: App icon (logo)
        working-directory: app
        run: |
          RES=android/app/src/main/res
          rm -rf $RES/mipmap-anydpi-v26
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p $RES/mipmap-$d
            cp www/icons/android/mipmap-$d/*.png $RES/mipmap-$d/
          done
      - name: Foreground service (background persistence)
        working-directory: app
        run: |
          PKG_DIR=android/app/src/main/java/com/laingopop/app
          mkdir -p $PKG_DIR
          cp android-src-patch/AlarmForegroundService.java $PKG_DIR/AlarmForegroundService.java
          cp android-src-patch/MainActivity.java $PKG_DIR/MainActivity.java
      - name: Permissions and service manifest
        working-directory: app
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>\n    <uses-permission android:name="android.permission.USE_EXACT_ALARM"/>\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>\n    <uses-permission android:name="android.permission.VIBRATE"/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC"/>\n    <application#' $M
          sed -i 's#</application>#    <service android:name=".AlarmForegroundService" android:foregroundServiceType="dataSync" android:stopWithTask="false" android:exported="false"/>\n</application>#' $M
          grep -n "uses-permission\|service android:name" $M
      - name: Sync
        working-directory: app
        run: npx cap sync android
      - name: Build APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: LaingoPop-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
